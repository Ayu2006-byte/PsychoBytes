<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GovFix — Municipal Grievance Resolution (G-02)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const initialComplaints = [
      {
        id: 'GF-2026-1042',
        title: 'Overflowing community garbage bin near Bus Stop 4',
        category: 'Garbage',
        ward: 'Ward 14 - Kothrud',
        location: 'Paud Road, opposite City Mart, Pune',
        priority: 'High',
        status: 'In Progress',
        officer: 'Sunil Jagtap (Solid Waste)',
        filedDate: 'Today, 08:30 AM',
        slaRemaining: '4h 15m',
        description: 'Green bin has not been cleared for 3 days. Pedestrian path blocked with foul odor.'
      },
      {
        id: 'GF-2026-1039',
        title: 'Deep pothole on arterial road causing skids',
        category: 'Roads & Potholes',
        ward: 'Ward 08 - Shivaji Nagar',
        location: 'JM Road, near Modern High School',
        priority: 'Critical',
        status: 'Pending',
        officer: 'Rajesh Kulkarni (Roads)',
        filedDate: 'Yesterday, 05:45 PM',
        slaRemaining: '12h 30m',
        description: 'Approx 2 feet wide pothole following recent asphalt erosion.'
      },
      {
        id: 'GF-2026-1025',
        title: 'Streetlights unlit across residential lane for 4 nights',
        category: 'Streetlights',
        ward: 'Ward 04 - Deccan Gymkhana',
        location: 'Lane 3, Prabhat Road',
        priority: 'Medium',
        status: 'Resolved',
        officer: 'Anand Shinde (Electrical)',
        filedDate: '07 Oct, 09:12 PM',
        slaRemaining: 'Resolved on-time',
        description: 'Phase failure affected 6 consecutive LED pole lights on Lane 3.'
      },
      {
        id: 'GF-2026-1011',
        title: 'Sewage drain blockage causing backflow',
        category: 'Water & Drainage',
        ward: 'Ward 21 - Hadapsar',
        location: 'Ganesh Nagar, Main Market Lane',
        priority: 'High',
        status: 'Overdue',
        officer: 'Vikas Patil (Drainage)',
        filedDate: '06 Oct, 07:10 AM',
        slaRemaining: 'Breached by 18h',
        description: 'Culvert blocked by construction silt, causing greywater overflow.'
      }
    ];

    const trucks = [
      {
        id: 'KG-MH-12-CZ-4491',
        driver: 'Santosh Gaikwad',
        route: 'Route A1 (Kothrud Depot to Karve Road)',
        location: 'Paud Phata Junction',
        eta: '8 mins',
        capacity: '72% Full',
        status: 'On Route'
      },
      {
        id: 'KG-MH-12-BF-8120',
        driver: 'Ramesh Jadhav',
        route: 'Route B3 (Shivaji Nagar North)',
        location: 'FC Road Complex',
        eta: '18 mins',
        capacity: '44% Full',
        status: 'At Collection Point'
      },
      {
        id: 'KG-MH-12-DF-2204',
        driver: 'Mahesh Borade',
        route: 'Route C2 (Hadapsar Sector)',
        location: 'Magarpatta South Gate',
        eta: '25 mins',
        capacity: '88% Full',
        status: 'In Transit'
      }
    ];

    function App() {
      const [tab, setTab] = useState('landing');
      const [complaints, setComplaints] = useState(initialComplaints);
      const [showModal, setShowModal] = useState(false);
      const [toast, setToast] = useState('');

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3500);
      };

      const addComplaint = (e) => {
        e.preventDefault();
        const form = e.target;
        const newC = {
          id: `GF-2026-${Math.floor(1050 + Math.random() * 800)}`,
          title: form.title.value,
          category: form.category.value,
          ward: form.ward.value,
          location: form.location.value,
          priority: form.priority.value,
          status: 'Pending',
          officer: 'Ward Desk Assigned',
          filedDate: 'Just now',
          slaRemaining: '24h 00m',
          description: form.desc.value || 'Grievance submitted by citizen.'
        };
        setComplaints([newC, ...complaints]);
        setShowModal(false);
        notify(`Complaint ${newC.id} registered!`);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {toast && (
            <div className="fixed top-4 right-4 z-50 bg-emerald-700 text-white px-4 py-2.5 rounded-lg shadow-xl text-sm flex items-center gap-2">
              <i className="fa-solid fa-circle-check"></i> {toast}
            </div>
          )}

          <header className="bg-slate-900 text-white px-6 py-4 border-b border-slate-800 flex items-center justify-between sticky top-0 z-40">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setTab('landing')}>
              <div className="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-lg">GF</div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold text-lg">GovFix</span>
                  <span className="text-[10px] bg-blue-500/20 text-blue-300 border border-blue-400/30 px-1.5 py-0.5 rounded">G-02 PROTO</span>
                </div>
                <div className="text-[11px] text-slate-400">Municipal Grievance Resolution Portal</div>
              </div>
            </div>

            <div className="flex items-center gap-2 text-xs">
              <button onClick={() => setTab('citizen')} className={`px-3 py-1.5 rounded-full font-medium ${tab === 'citizen' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300'}`}>Citizen View</button>
              <button onClick={() => setTab('officer')} className={`px-3 py-1.5 rounded-full font-medium ${tab === 'officer' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-300'}`}>Officer View</button>
              <button onClick={() => setTab('supervisor')} className={`px-3 py-1.5 rounded-full font-medium ${tab === 'supervisor' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300'}`}>Supervisor View</button>
            </div>
          </header>

          <div className="flex-1 max-w-7xl w-full mx-auto p-6 flex gap-6">
            <aside className="w-60 flex-shrink-0 hidden md:block">
              <div className="bg-white rounded-xl border border-slate-200 p-4 sticky top-24 space-y-1 text-sm font-medium">
                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 py-1">Modules</div>
                {[
                  { id: 'landing', label: 'Home / Overview', icon: 'fa-house' },
                  { id: 'citizen', label: 'Citizen Dashboard', icon: 'fa-user' },
                  { id: 'categories', label: 'Categories & SLAs', icon: 'fa-list-check' },
                  { id: 'tracker', label: 'Kachara Gadi Tracker', icon: 'fa-truck' },
                  { id: 'officer', label: 'Officer Queue', icon: 'fa-shield-halved' },
                  { id: 'supervisor', label: 'Supervisor SLA Matrix', icon: 'fa-chart-pie' }
                ].map(item => (
                  <button 
                    key={item.id} 
                    onClick={() => setTab(item.id)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition ${tab === item.id ? 'bg-blue-50 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    <i className={`fa-solid ${item.icon} w-4`}></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </div>
            </aside>

            <main className="flex-1 min-w-0">
              {tab === 'landing' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white p-10 rounded-2xl shadow-xl">
                    <span className="text-xs bg-blue-500/20 text-blue-300 border border-blue-400/30 px-3 py-1 rounded-full font-semibold">Civic Grievance Resolution System</span>
                    <h1 className="text-4xl font-black mt-4">GovFix Municipal Redressal</h1>
                    <p className="mt-3 text-slate-300 text-sm max-w-xl">
                      Report garbage dumps, road potholes, damaged streetlights, and drainage issues. Track live SLA turnaround and garbage truck (Kachara Gadi) timings in your ward.
                    </p>
                    <div className="mt-6 flex gap-3">
                      <button onClick={() => setTab('citizen')} className="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-lg text-sm font-bold shadow">File Grievance</button>
                      <button onClick={() => setTab('tracker')} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-5 py-2.5 rounded-lg text-sm font-bold">Track Kachara Gadi</button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {[
                      { title: 'Garbage & Solid Waste', sla: '24h SLA', icon: 'fa-trash', color: 'from-amber-500 to-orange-600' },
                      { title: 'Roads & Potholes', sla: '48-72h SLA', icon: 'fa-road', color: 'from-blue-600 to-indigo-700' },
                      { title: 'Streetlights & Poles', sla: '24h SLA', icon: 'fa-lightbulb', color: 'from-yellow-500 to-amber-600' },
                      { title: 'Water & Drainage', sla: '12-24h SLA', icon: 'fa-droplet', color: 'from-cyan-600 to-blue-700' }
                    ].map((c, i) => (
                      <div key={i} onClick={() => setTab('categories')} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm cursor-pointer hover:shadow-md transition">
                        <div className={`w-10 h-10 rounded-lg bg-gradient-to-br ${c.color} text-white flex items-center justify-center mb-3 shadow`}>
                          <i className={`fa-solid ${c.icon}`}></i>
                        </div>
                        <h3 className="font-bold text-slate-800 text-sm">{c.title}</h3>
                        <p className="text-xs text-blue-600 font-semibold mt-2">{c.sla}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {tab === 'citizen' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center bg-white p-5 rounded-xl border border-slate-200">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900">Citizen Grievances</h2>
                      <p className="text-xs text-slate-500">Report issues and track official actions</p>
                    </div>
                    <button onClick={() => setShowModal(true)} className="bg-blue-600 text-white font-semibold text-xs px-4 py-2.5 rounded-lg shadow hover:bg-blue-500">
                      + File Grievance
                    </button>
                  </div>

                  <div className="space-y-3">
                    {complaints.map(item => (
                      <div key={item.id} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <div className="flex justify-between items-center text-xs">
                          <div className="flex items-center gap-2">
                            <span className="font-mono font-bold bg-slate-100 px-2 py-0.5 rounded">{item.id}</span>
                            <span className="bg-blue-50 text-blue-700 font-semibold px-2 py-0.5 rounded">{item.category}</span>
                            <span className="bg-orange-50 text-orange-700 font-semibold px-2 py-0.5 rounded">{item.priority}</span>
                          </div>
                          <span className={`px-2 py-0.5 rounded-full font-bold text-[11px] ${item.status === 'Resolved' ? 'bg-emerald-100 text-emerald-800' : item.status === 'In Progress' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'}`}>{item.status}</span>
                        </div>
                        <h3 className="font-bold text-slate-900 text-sm mt-2">{item.title}</h3>
                        <p className="text-xs text-slate-600 mt-1">{item.description}</p>
                        <div className="text-[11px] text-slate-400 mt-3 pt-2 border-t border-slate-100 flex justify-between">
                          <span>{item.ward} &bull; {item.location}</span>
                          <span>SLA: {item.slaRemaining}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {tab === 'tracker' && (
                <div className="space-y-6">
                  <div className="bg-white p-5 rounded-xl border border-slate-200">
                    <div className="flex items-center gap-2">
                      <h2 className="text-lg font-bold text-slate-900">Kachara Gadi Ward Tracker</h2>
                      <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">MOCK DATA</span>
                    </div>
                    <p className="text-xs text-slate-500">Simulated municipal collection trucks and scheduled checkpoints</p>
                  </div>

                  <div className="bg-slate-950 p-6 rounded-2xl text-white border border-slate-800">
                    <div className="text-xs font-mono text-emerald-400 mb-2">LIVE ROUTE SIMULATION (PUNE WARD 14 & 08)</div>
                    <div className="h-48 bg-slate-900 rounded-xl border border-slate-800 p-4 relative flex items-center justify-center">
                      <div className="text-center">
                        <i className="fa-solid fa-map-location-dot text-4xl text-blue-500 mb-2"></i>
                        <p className="text-xs text-slate-300 font-mono">Simulated GPS Mesh Active</p>
                        <p className="text-[10px] text-slate-500 mt-1">3 trucks reporting coordinates</p>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {trucks.map(t => (
                      <div key={t.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <div className="font-mono font-bold text-xs text-slate-900">{t.id}</div>
                        <div className="text-xs text-slate-500 mt-1">{t.route}</div>
                        <div className="mt-3 text-xs space-y-1">
                          <div><strong>Location:</strong> {t.location}</div>
                          <div><strong>ETA to Next Point:</strong> <span className="text-emerald-600 font-bold">{t.eta}</span></div>
                          <div><strong>Capacity:</strong> {t.capacity}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {tab === 'officer' && (
                <div className="space-y-6">
                  <div className="bg-white p-5 rounded-xl border border-slate-200">
                    <h2 className="text-lg font-bold text-slate-900">Field Officer Action Queue</h2>
                    <p className="text-xs text-slate-500">Resolve and update reported civic defects</p>
                  </div>

                  <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
                    <table className="w-full text-xs text-left">
                      <thead className="bg-slate-100 text-slate-600 uppercase font-semibold">
                        <tr>
                          <th className="p-3">ID</th>
                          <th className="p-3">Grievance</th>
                          <th className="p-3">Category</th>
                          <th className="p-3">Priority</th>
                          <th className="p-3">Status</th>
                          <th className="p-3 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {complaints.map(c => (
                          <tr key={c.id}>
                            <td className="p-3 font-mono font-bold">{c.id}</td>
                            <td className="p-3 font-semibold">{c.title}</td>
                            <td className="p-3">{c.category}</td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded bg-slate-100 font-bold">{c.priority}</span></td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded font-bold bg-blue-50 text-blue-700">{c.status}</span></td>
                            <td className="p-3 text-right">
                              {c.status !== 'Resolved' && (
                                <button 
                                  onClick={() => {
                                    setComplaints(complaints.map(x => x.id === c.id ? { ...x, status: 'Resolved' } : x));
                                    notify(`Resolved ${c.id}`);
                                  }}
                                  className="bg-emerald-600 text-white px-2.5 py-1 rounded font-semibold text-[11px]"
                                >
                                  Resolve
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {tab === 'supervisor' && (
                <div className="space-y-6">
                  <div className="bg-white p-5 rounded-xl border border-slate-200">
                    <h2 className="text-lg font-bold text-slate-900">Supervisor SLA & Ward Audit</h2>
                    <p className="text-xs text-slate-500">Summary statistics across municipal sectors</p>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div className="bg-white p-4 rounded-xl border border-slate-200">
                      <div className="text-xs text-slate-400 font-bold uppercase">Total Logged</div>
                      <div className="text-2xl font-black mt-1">1,432</div>
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-slate-200">
                      <div className="text-xs text-slate-400 font-bold uppercase">Active</div>
                      <div className="text-2xl font-black text-blue-600 mt-1">228</div>
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-slate-200">
                      <div className="text-xs text-slate-400 font-bold uppercase">Resolved</div>
                      <div className="text-2xl font-black text-emerald-600 mt-1">1,176</div>
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-slate-200">
                      <div className="text-xs text-slate-400 font-bold uppercase">Overdue</div>
                      <div className="text-2xl font-black text-red-600 mt-1">28</div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {showModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 border border-slate-200">
                <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                  <h3 className="font-bold text-slate-900">File New Grievance</h3>
                  <button onClick={() => setShowModal(false)}><i className="fa-solid fa-xmark"></i></button>
                </div>
                <form onSubmit={addComplaint} className="mt-4 space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Category</label>
                    <select name="category" className="w-full border p-2 rounded">
                      <option value="Garbage">Garbage & Solid Waste</option>
                      <option value="Roads & Potholes">Roads & Potholes</option>
                      <option value="Streetlights">Streetlights & Lighting</option>
                      <option value="Water & Drainage">Water & Drainage</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Issue Title</label>
                    <input name="title" required placeholder="e.g. Uncollected garbage bin" className="w-full border p-2 rounded" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Ward</label>
                    <select name="ward" className="w-full border p-2 rounded">
                      <option value="Ward 14 - Kothrud">Ward 14 - Kothrud</option>
                      <option value="Ward 08 - Shivaji Nagar">Ward 08 - Shivaji Nagar</option>
                      <option value="Ward 04 - Deccan">Ward 04 - Deccan Gymkhana</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Location Landmark</label>
                    <input name="location" required placeholder="e.g. Near Paud Phata Bus Stop" className="w-full border p-2 rounded" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Priority</label>
                    <select name="priority" className="w-full border p-2 rounded">
                      <option value="Medium">Medium</option>
                      <option value="High">High</option>
                      <option value="Critical">Critical</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Description</label>
                    <textarea name="desc" rows="2" className="w-full border p-2 rounded" placeholder="Additional details..."></textarea>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onClick={() => setShowModal(false)} className="px-3 py-1.5 text-slate-500">Cancel</button>
                    <button type="submit" className="bg-blue-600 text-white font-bold px-4 py-1.5 rounded">Submit</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
